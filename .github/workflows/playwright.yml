name: Playwright Tests
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # --- DÉMARRAGE DES SERVEURS ---
      - name: Start backend server
        run: npm run start:api &  # ⚠️ À modifier : mets la vraie commande qui lance ton backend

      - name: Start frontend server
        run: npm run dev &        # ⚠️ À modifier : mets la vraie commande de ton front (ex: npm run dev)

      - name: Wait for servers
        run: npx wait-on http://localhost:5173  # ⚠️ À modifier : mets l'URL et le port de ton front
      # ------------------------------

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30